locale: en
failOn: high
minSeverity: info

rules:
  enabled: []
  disabled: []

paths:
  include: []
  exclude:
    - dist/**
    - coverage/**

baseline:
  path: .pr-sentinel-baseline.json
  update: false

ai:
  enabled: true
  provider: openai
  model: gpt-5.4-mini
  strict: false
  timeoutMs: 15000

github:
  comment: true
  annotations: true
