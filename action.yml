name: PR Sentinel
description: Scan pull request diffs for review risk signals.
author: Yao Wenjie
inputs:
  locale:
    description: Report language. Supports en or zh-CN.
    required: false
    default: ""
  config:
    description: Path to a .pr-sentinel.yml config file.
    required: false
    default: ""
  fail-on:
    description: Minimum severity that should fail the workflow.
    required: false
    default: high
  min-severity:
    description: Minimum severity to include in the report.
    required: false
    default: info
  format:
    description: Output format. Use markdown, json, or sarif.
    required: false
    default: markdown
  baseline:
    description: Path to a baseline JSON file.
    required: false
    default: ""
  update-baseline:
    description: Update the baseline file with current findings.
    required: false
    default: "false"
  write-sarif:
    description: Path to write a SARIF report.
    required: false
    default: ""
  exclude-rule:
    description: Comma-separated rule ids to skip.
    required: false
    default: ""
  ai-provider:
    description: AI provider to use. Supports openai, anthropic, or ollama.
    required: false
    default: ""
  ai-model:
    description: Custom AI model name for the selected provider.
    required: false
    default: ""
  no-ai:
    description: Disable AI review for this run.
    required: false
    default: "false"
  github-token:
    description: GitHub token used for PR comments and Checks annotations.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Fetch base branch
      shell: bash
      run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"
    - name: Run PR Sentinel
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        args=(scan --fail-on "${{ inputs.fail-on }}" --min-severity "${{ inputs.min-severity }}" --format "${{ inputs.format }}")
        if [ -n "${{ inputs.locale }}" ]; then args+=(--locale "${{ inputs.locale }}"); fi
        if [ -n "${{ inputs.config }}" ]; then args+=(--config "${{ inputs.config }}"); fi
        if [ -n "${{ inputs.exclude-rule }}" ]; then args+=(--exclude-rule "${{ inputs.exclude-rule }}"); fi
        if [ -n "${{ inputs.ai-provider }}" ]; then args+=(--ai-provider "${{ inputs.ai-provider }}"); fi
        if [ -n "${{ inputs.ai-model }}" ]; then args+=(--ai-model "${{ inputs.ai-model }}"); fi
        if [ -n "${{ inputs.baseline }}" ]; then args+=(--baseline "${{ inputs.baseline }}"); fi
        if [ -n "${{ inputs.write-sarif }}" ]; then args+=(--write-sarif "${{ inputs.write-sarif }}"); fi
        if [ "${{ inputs.update-baseline }}" = "true" ]; then args+=(--update-baseline); fi
        if [ "${{ inputs.no-ai }}" = "true" ]; then args+=(--no-ai); fi
        node "$GITHUB_ACTION_PATH/bin/pr-sentinel.js" "${args[@]}"
